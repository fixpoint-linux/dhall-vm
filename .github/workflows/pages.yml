# Deploy the static dhall-c WASM demo (docs/) to GitHub Pages on every push.
#
# The wasm (docs/dhall.js + docs/dhall.wasm) is committed, so this workflow only
# uploads the docs/ directory — no toolchain or build step is needed in CI.
# Rebuild the wasm locally after changing the C code: `make wasm`.
#
# Enable once in the repo: Settings -> Pages -> Source -> "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
